  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Un desarrollo residencial
      emphasis: con tres formas distintas de vivir, dentro de un mismo proyecto.

    body:
      - Garden house en planta baja, departamento en los niveles intermedios y penthouse en el último nivel - tres tipologías pensadas para etapas de vida distintas, no una sola fórmula repetida piso tras piso.

    image:
      image: ../../assets/img/projects/cova-chilpancingo/intro.webp
      alt: Vista arquitectónica de COVA Chilpancingo

    decoration:
      image: ../../assets/img/projects/cova-chilpancingo/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Caracterizada por su cercanía a Parque México,
      emphasis: Andaz Condesa y el Hospital Ángeles Metropolitano.

    body:
      - COVA Chilpancingo se ubica en Chilpancingo 54, en Hipódromo Condesa, Ciudad de México.
      - Chilpancingo 54 está a unas cuadras de Parque México, sobre una zona con acceso directo a Insurgentes, Reforma y Circuito Interior.
      - Alrededor del proyecto hay una oferta amplia de restaurantes, bares y espacios de bienestar, además de servicios de salud como el Hospital Ángeles Metropolitano y la Torre Médica Dalinde.
      - Gastronomía y vida nocturna - Restaurante Castizo, Roberta Trattoria, Hookah Lounge, Mendl Delicatessen, Restaurante Patagonia, Maque Condesa, Ojo de Agua, Caimán Bar, El Pescadito Roma, Andaz Condesa, Terraza Central Roma Sur.
      - Salud y bienestar - Hospital Ángeles Metropolitano, Torre Médica Dalinde, COMMANDO Condesa, Mukta Yoga.
      - Cultural y espacios públicos - Parque México.

