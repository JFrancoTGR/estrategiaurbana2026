  amenities:
    visible: true

    index: '03 / Amenidades'

    title:
      lead: Menos amenidades, menos mantenimiento
      emphasis: y más de lo que sí necesitas en tu día a día.

    eyebrow: Diseñado con intención. Pensado para durar.

