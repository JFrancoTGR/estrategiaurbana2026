  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Una colonia que invita a caminar,
      emphasis: un proyecto que invita a quedarse.

    body:
      - Un conjunto residencial pensado para quienes han elegido la Condesa como su lugar para vivir. Conformado por tres torres, el proyecto permite disfrutar de todo lo que esta colonia tiene para ofrecer.

    image:
      image: ../../assets/img/projects/cova-chilpancingo/intro.webp
      alt: Vista arquitectónica de COVA Chilpancingo

    decoration:
      image: ../../assets/img/projects/cova-chilpancingo/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: A unas cuadras de Parque México, en una colonia
      emphasis: que siempre tiene algo nuevo que ofrecer.

    body:
      - La Condesa se distingue por su constante actividad cultural, comercial y social. Entre comercios locales, espacios recreativos y nuevas propuestas gastronómicas, siempre hay algo por descubrir.
      - Su amplia oferta de servicios, facilidad de movilidad y la posibilidad de realizar gran parte de las actividades cotidianas a pie son características que mantienen su atractivo residencial y favorecen su potencial de plusvalía a largo plazo.

