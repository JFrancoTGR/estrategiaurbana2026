  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Tijuana tiene mucho que ofrecer.
      emphasis: PORTTICA también.

    body:
      - PORTTICA es un desarrollo residencial ubicado en la Zona Dorada de Tijuana, Baja California, que combina la cercanía a los principales puntos de interés de la ciudad con diferentes opciones para vivir o invertir.
      - Su propuesta reúne departamentos de 1, 2 y 3 recámaras, amenidades para el deporte y el entretenimiento, y espacios para disfrutar de tu tiempo libre sin salir de casa.

    image:
      image: ../../assets/img/projects/porttica/intro.webp
      alt: Vista arquitectónica de PORTTICA

    decoration:
      image: ../../assets/img/projects/porttica/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: En La Cacho, una de las zonas
      emphasis: más conocidas de Tijuana.

    body:
      - PORTTICA se encuentra sobre el Boulevard Cuauhtémoc Sur, en una zona de la ciudad reconocida por su oferta gastronómica, comercios y servicios.
      - Su cercanía con importantes zonas comerciales y de negocios permite disfrutar de las ventajas de vivir en un entorno urbano, con distintas opciones de entretenimiento y servicios a su alrededor.

