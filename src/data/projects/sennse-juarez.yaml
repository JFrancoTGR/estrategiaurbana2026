  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Un desarrollo residencial enfocado
      emphasis: en el estilo de vida urbano de la Juárez.

    body:
      - Pocas unidades, buena escala y una de las colonias más vivas de la ciudad a la puerta. Aquí el día se resuelve caminando - el café de la mañana, la oficina sobre Reforma, la cena en la Zona Rosa. Y de regreso, un roof garden para ver caer la tarde.
      - El proyecto integra una torre habitacional de 10 niveles con departamentos de 1 y 2 recámaras, un local comercial en planta baja y amenidades pensadas para el día a día, desde roof top hasta espacios de co-working.

    image:
      image: ../../assets/img/projects/sennse-juarez/intro.webp
      alt: Vista arquitectónica de Sennse Juárez

    decoration:
      image: ../../assets/img/projects/sennse-juarez/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Caracterizada por su cercanía a Reforma, el Ángel de la Independencia
      emphasis: y la oferta gastronómica de Roma-Condesa.

    body:
      - Ubicado en Nápoles 86, Colonia Juárez, el proyecto se sitúa en una de las zonas con mayor actividad urbana y cultural de la Ciudad de México.
      - La ubicación ofrece una combinación de conectividad, vida gastronómica y acceso a espacios culturales y comerciales, consolidándose como un punto estratégico entre el Centro Histórico y las colonias Roma-Condesa.
      - Restaurantes de autor, cafeterías, bares y una amplia oferta cultural y comercial. Calles arboladas, arquitectura histórica y espacios públicos que permiten disfrutar de la ciudad a pie.


