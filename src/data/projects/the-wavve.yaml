  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Mucho más por 
      emphasis: disfrutar en THE WAVVE.

    body:
      - Ubicado en Playas de Tijuana, Baja California, THE WAVVE es un desarrollo residencial de dos torres que reúne departamentos con vistas panorámicas al mar y espacios para disfrutar más allá de tu departamento.
      - Desde una tarde en la alberca hasta un partido de pádel o una reunión con amigos, THE WAVVE cuenta con amenidades que te permiten aprovechar tu tiempo libre sin tener que salir de casa.

    image:
      image: ../../assets/img/projects/the-wavve/intro.webp
      alt: Vista arquitectónica de THE WAVVE

    decoration:
      image: ../../assets/img/projects/the-wavve/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Una ubicación con
      emphasis: mucho por descubrir.

    body:
      - THE WAVVE se encuentra sobre la Carretera Escénica Tijuana–Ensenada, en Playas de Tijuana, una zona que combina paisajes costeros con cercanía a distintos puntos de interés.
      - Su ubicación permite disfrutar de restaurantes, playas y atractivos turísticos de la región, además de facilitar los traslados hacia la frontera con Estados Unidos.

