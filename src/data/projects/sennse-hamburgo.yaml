    # =========================
    # INTRO / OVERVIEW
    # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Un desarrollo boutique
      emphasis: de solo 24 unidades.

    body:
      - Pocas unidades, 1 y 2 recámaras, pensadas para quienes buscan algo más personal. Un proyecto compacto, donde lo boutique no es solo el tamaño, sino la forma en que está pensado cada departamento.

    image:
      image: ../../assets/img/projects/sennse-hamburgo/intro.webp
      alt: Vista arquitectónica de Sennse Hamburgo

    decoration:
      image: ../../assets/img/projects/sennse-hamburgo/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Caracterizada por su cercanía a
      emphasis:  Soho House, Restaurante Rosetta y el Jardín Chapultepec.

    body:
      - Hamburgo 112 está a unas cuadras del Jardín Chapultepec y Puerto Prendes, en una de las zonas con mayor vida gastronómica y cultural de la Ciudad de México.
      - Gastronomía y vida nocturna - Café Nin, Cicatriz Bar, Hanky Panky, Yuyu Bar, Cana Restaurante, Parker & Lenox, Amaya, Soho House, Taquería Orinoco, Niddo Restaurante, Puerto Prendes, Restaurante Rosetta, Plantasia Café, Cafebrería El Péndulo, Cityzen Rooftop Bar.
      - Cultura y espacios públicos - Jardín Chapultepec, Fuente de Cibeles, Plaza Río de Janeiro, Reforma 222.
      - Fitness y bienestar - Escuadrón Crossfit Reforma, Smart Fit Genova.

