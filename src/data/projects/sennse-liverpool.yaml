  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Un desarrollo residencial pensado
      emphasis: para el día a día, no solo para el fin de semana.

    body:
      - Diseñado bajo la idea de que el estilo de vida no debería limitarse a ocasiones especiales, sino integrarse a la vida cotidiana de sus residentes.

    image:
      image: ../../assets/img/projects/sennse-liverpool/intro.webp
      alt: Vista arquitectónica de Sennse Liverpool

    decoration:
      image: ../../assets/img/projects/sennse-liverpool/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Caracterizada por su cercanía a Soho House,
      emphasis: Restaurante Rosetta y el Jardín Chapultepec.

    body:
      - Ubicado en Liverpool 108, Colonia Juárez, el proyecto se sitúa en una de las zonas con mayor vida social y cultural de la Ciudad de México.
      - La ubicación ofrece una combinación de conectividad, oferta gastronómica y espacios de recreación, consolidándose como un punto de referencia entre la Zona Rosa y la Roma-Condesa.

