  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: A un paso del
      emphasis: Castillo de Chapultepec.

    body:
      - Un desarrollo que ofrece, en sus niveles más altos, vista directa al Castillo de Chapultepec, uno de los puntos más emblemáticos de la Ciudad de México.

    image:
      image: ../../assets/img/projects/sennse-vasconcelos/intro.webp
      alt: Vista arquitectónica de Sennse Vasconcelos

    decoration:
      image: ../../assets/img/projects/sennse-vasconcelos/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Caracterizada por su cercanía al Bosque de Chapultepec,
      emphasis: Parque España y Parque México.

    body:
      - Vasconcelos 154 está a unas cuadras del Bosque de Chapultepec, sobre el Circuito Interior, con acceso directo a Av. Chapultepec, Av. Insurgentes y Paseo de la Reforma.
      - Alrededor del proyecto hay una oferta de restaurantes, bares y espacios culturales, además de comercio como El Palacio de Hierro.
      - Gastronomía y vida nocturna -  Maizajo, Ling Ling, Wallace Whisky Bar, Restaurante Primos, Patagonia, Cafebrería El Péndulo.
      - Cultura y espacios públicos -  Bosque de Chapultepec, Parque España, Parque México, Plaza de los Compositores, Galería RGR, Estela de Luz, Foro Shakespeare.
      - Fitness y bienestar - Smart Fit Condesa.
      - Comercio y servicios -  El Palacio de Hierro, Embajada de la Federación Rusa.

