  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Es un desarrollo residencial de
      emphasis: tipo resort frente al mar.

    body:
      - Ubicado en Rosarito, Baja California, NAOS Resort Living ofrece residencias de 1, 2 y 3 recámaras, con vistas panorámicas, acceso directo a la playa y amenidades tipo resort.
      - Una propuesta residencial que reúne ubicación, comodidad y espacios para disfrutar, ya sea como hogar, segunda residencia o inversión patrimonial.

    image:
      image: ../../assets/img/projects/naos-resort-living/intro.webp
      alt: Vista arquitectónica de NAOS Resort Living

    decoration:
      image: ../../assets/img/projects/naos-resort-living/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Una ubicación costera conectada con
      emphasis: Playas de Tijuana, Rosarito y el sur de California.

    body:
      - NAOS Resort Living se encuentra sobre la Carretera Escénica Tijuana–Ensenada, frente al océano Pacífico.
      - Su entorno combina paisajes naturales con la cercanía a restaurantes, atractivos turísticos y opciones de entretenimiento, además de una conexión directa con la frontera de Estados Unidos.

