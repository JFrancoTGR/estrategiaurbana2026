  # =========================
  # INTRO / OVERVIEW
  # =========================

  intro:
    index: '01 / Overview'

    title:
      lead: Es un desarrollo residencial de
      emphasis: tipo resort frente al mar.

    body:
      - Concebido para ofrecer una experiencia de vida que combina lujo, confort y conexión directa con el entorno natural.
      - El proyecto integra una torre habitacional de 22 niveles con un enfoque en vistas panorámicas, diseño contemporáneo y amenidades de alto nivel.

    image:
      image: ../../assets/img/projects/naos-resort-living/intro.webp
      alt: Vista arquitectónica de NAOS Resort Living

    decoration:
      image: ../../assets/img/projects/naos-resort-living/intro-decoration.svg

  # =========================
  # LOCATION
  # =========================

  location:
    index: '02 / Ubicación'

    title:
      lead: Caracterizada por su cercanía a
      emphasis: Rosarito, Playas de Tijuana y el Valle de Guadalupe.

    body:
      - Ubicado sobre la Carretera Escénica Tijuana–Ensenada, el proyecto se sitúa en una de las zonas con mayor proyección de la región.
      - La ubicación ofrece una combinación única de conectividad, entorno natural y acceso a oferta gastronómica y recreativa, consolidándose como un punto estratégico entre México y Estados Unidos.

